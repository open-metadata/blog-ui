<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Redirecting...</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #fff;
        color: #333;
      }
      p {
        font-size: 16px;
      }
      a {
        color: #5f5af6;
      }
    </style>
    <script>
      // Redirect blog.getcollate.io[/slug][?query] → getcollate.io/blog[/slug][?query]
      (function () {
        var path = window.location.pathname; // e.g. "/some-post" or "/"
        var search = window.location.search; // e.g. "?foo=bar" or ""
        var hash = window.location.hash;    // e.g. "#section" or ""

        // Strip leading slash from path so we don't get double slashes
        var slug = path.replace(/^\//, "");
        var destination = "https://getcollate.io/blog" + (slug ? "/" + slug : "") + search + hash;

        window.location.replace(destination);
      })();
    </script>
  </head>
  <body>
    <p>
      Redirecting to
      <a id="link" href="https://getcollate.io/blog">getcollate.io/blog</a>...
    </p>
    <script>
      // Update the fallback link text to show the actual destination
      var path = window.location.pathname;
      var slug = path.replace(/^\//, "");
      var destination = "https://getcollate.io/blog" + (slug ? "/" + slug : "") + window.location.search + window.location.hash;
      document.getElementById("link").href = destination;
    </script>
  </body>
</html>
